# ---------------------------------------------------------------------------
# TEST STUB ONLY. This is NOT the real datapath.
# The complete dsp_tp.sv topology is kept off this machine (on the work PC).
# This minimal graph exists only to exercise get_signal_path / topology_check
# in replay mode. Replace with (or point config.topology_path at) the real file
# when running live.
# ---------------------------------------------------------------------------
version: 1

nodes:
  ADC0:  {kind: source}
  MIX:   {kind: process, params_prefix: MIX}
  LPF0:  {kind: process, params_prefix: LPF0}
  PI0:   {kind: process, params_prefix: PI0}
  GAIN0: {kind: process, params_prefix: GAIN0}
  DAC0:  {kind: sink}
  SCOPE0: {kind: sink}

fixed_edges:
  - [ADC0, MIX]
  - [LPF0, PI0]
  - [GAIN0, DAC0]

selectors:
  - dest: LPF0
    register: INPUT_SEL
    sources: {0: ADC0, 1: MIX}
  - dest: GAIN0
    register: OUT_SEL
    sources: {0: PI0, 1: LPF0}
  - dest: SCOPE0
    register: SCOPE0_SEL
    sources: {0: ADC0, 1: LPF0, 2: DAC0}
